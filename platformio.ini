; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; === Firmware chinh (Pick & Place) ===
[env:esp32s3usbotg]
platform = espressif32
board = esp32s3usbotg
framework = arduino
lib_deps =
    madhephaestus/ESP32Servo@^3.0.0
    adafruit/Adafruit_VL53L0X@^1.2.0
    adafruit/Adafruit SSD1306@^2.5.7
build_src_filter = +<*> -<test_periph.cpp> -<test_xy_servo.cpp> -<test_vl53.cpp> -<test_l298n.cpp> -<test_z_axis.cpp>

; === Test rieng: dieu khien XY bang 2 servo + IK 5-bar ===
; Upload:
;   pio run -e test_xy_servo -t upload
; Monitor:
;   pio device monitor -b 115200
[env:test_xy_servo]
platform = espressif32
board = esp32s3usbotg
framework = arduino
lib_deps =
    madhephaestus/ESP32Servo@^3.0.0
build_src_filter =
    -<*>
    +<test_xy_servo.cpp>
    +<ik_5bar.c>

; === Test rieng: doc cam bien khoang cach VL53L0X ===
; Upload:
;   pio run -e test_vl53 -t upload
; Monitor:
;   pio device monitor -b 115200
[env:test_vl53]
platform = espressif32
board = esp32s3usbotg
framework = arduino
lib_deps =
    adafruit/Adafruit_VL53L0X@^1.2.0
build_src_filter =
    -<*>
    +<test_vl53.cpp>
    +<vl53l0x.cpp>

; === Test rieng: truc Z + doc encoder (kiem tra chuan) ===
; Upload:
;   pio run -e test_z_axis -t upload
; Monitor:
;   pio device monitor -b 115200
[env:test_z_axis]
platform = espressif32
board = esp32s3usbotg
framework = arduino
build_src_filter =
    -<*>
    +<test_z_axis.cpp>
    +<z_axis.cpp>
